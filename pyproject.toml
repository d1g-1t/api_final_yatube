[project]
name = "streamhub-api"
version = "1.0.0"
description = "Современный API для социальной платформы"
authors = [{name = "Pavel Okhrim", email = "pavel@example.com"}]
requires-python = ">=3.12"

dependencies = [
    "django>=5.0",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "djoser>=2.2",
    "pillow>=12.3",
    "psycopg2-binary>=2.9",
    "redis>=5.0",
    "django-redis>=5.4",
    "gunicorn>=21.2",
    "python-decouple>=3.8",
    "drf-spectacular>=0.27",
    "django-cors-headers>=4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-django>=4.7",
    "pytest-cov>=4.1",
    "factory-boy>=3.3",
    "ruff>=0.1",
    "ipython>=8.18",
]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "N", "W", "B", "Q"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = "-v -s --tb=short"
