services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: streamhub-db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-streamhub_db}
      POSTGRES_USER: ${POSTGRES_USER:-streamhub_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streamhub_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U streamhub_user -d streamhub_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: streamhub-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  # Django Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: streamhub-web
    restart: unless-stopped
    command: sh -c "python manage.py makemigrations && python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --reload"
    volumes:
      - ./streamhub:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "${WEB_PORT:-8000}:8000"
    environment:
      # Database
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${POSTGRES_DB:-streamhub_db}
      DB_USER: ${POSTGRES_USER:-streamhub_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-streamhub_pass}
      DB_HOST: db
      DB_PORT: 5432
      # Redis
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Django
      SECRET_KEY: ${SECRET_KEY:-django-insecure-dev-key-change-in-production-8f3h9s7d6g5h4j3k2l1}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.development}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
